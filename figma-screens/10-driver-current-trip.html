<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>10 Driver Current Trip</title>
  <style>

    :root {
      --bg: #eef3f8;
      --surface: #ffffff;
      --surface-soft: #f7fafc;
      --nav: #10233f;
      --nav-2: #17365f;
      --text: #172033;
      --muted: #667085;
      --line: #d8e0ea;
      --blue: #2563eb;
      --blue-soft: #e9f1ff;
      --green: #16a34a;
      --green-soft: #e9f8ef;
      --yellow: #d97706;
      --yellow-soft: #fff5db;
      --red: #dc2626;
      --red-soft: #ffebeb;
      --purple: #7c3aed;
      --purple-soft: #f1eaff;
      --shadow: 0 18px 45px rgba(16, 35, 63, 0.12);
      --radius: 18px;
      --radius-sm: 12px;
      --font: Inter, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .page {
      display: flex;
      flex-direction: column;
      gap: 56px;
      padding: 48px;
    }

    .figma-frame {
      position: relative;
      overflow: hidden;
      background: var(--surface-soft);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .desktop {
      width: 1440px;
      height: 900px;
    }

    .mobile {
      width: 390px;
      height: 844px;
      border-radius: 34px;
    }

    .label {
      position: absolute;
      top: 24px;
      right: 28px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 20;
    }

    .sidebar {
      width: 260px;
      height: 100%;
      padding: 28px 20px;
      background: var(--nav);
      color: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f80ed, #41d1ff);
      color: #ffffff;
      font-weight: 800;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: #aab7ca;
      font-size: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      color: #c7d2e4;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-item.active {
      background: var(--nav-2);
      color: #ffffff;
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.9;
    }

    .app {
      display: flex;
      height: 100%;
    }

    .content {
      flex: 1;
      padding: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 14px;
      font-weight: 700;
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 800;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }

    .stat-card {
      min-height: 104px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 850;
    }

    .stat-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .grid-main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      height: 646px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 850;
    }

    .panel-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .pill.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .pill.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .pill.yellow {
      background: var(--yellow-soft);
      color: var(--yellow);
    }

    .pill.red {
      background: var(--red-soft);
      color: var(--red);
    }

    .map {
      position: relative;
      height: calc(100% - 58px);
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        #edf6fb;
      background-size: 54px 54px;
    }

    .route {
      position: absolute;
      height: 7px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.36);
      transform-origin: left center;
    }

    .route.green {
      background: rgba(22, 163, 74, 0.4);
    }

    .route.red {
      background: rgba(220, 38, 38, 0.38);
    }

    .vehicle-marker {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(16, 35, 63, 0.24);
    }

    .vehicle-marker.green {
      background: var(--green);
    }

    .vehicle-marker.blue {
      background: var(--blue);
    }

    .vehicle-marker.yellow {
      background: var(--yellow);
    }

    .vehicle-marker.red {
      background: var(--red);
    }

    .vehicle-popup {
      position: absolute;
      left: 530px;
      top: 215px;
      width: 260px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .popup-title {
      font-size: 16px;
      font-weight: 850;
    }

    .popup-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .popup-row strong {
      color: var(--text);
    }

    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }

    .vehicle-list {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .list-search {
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
    }

    .vehicle-row {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }

    .vehicle-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .row-title {
      font-size: 13px;
      font-weight: 850;
    }

    .row-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
    }

    .status.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .status.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .status.yellow {
      background: var(--yellow-soft);
      color: var(--yellow);
    }

    .status.red {
      background: var(--red-soft);
      color: var(--red);
    }

    .alerts {
      height: 248px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .alert-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .alert-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 850;
    }

    .alert-desc {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #ffffff;
      font-size: 13px;
      font-weight: 850;
    }

    .button.secondary {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .button.outline {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .login-screen {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      height: 100%;
      background: #ffffff;
    }

    .login-hero {
      position: relative;
      padding: 72px;
      background: linear-gradient(135deg, #10233f, #1e4f88);
      color: #ffffff;
      overflow: hidden;
    }

    .hero-circles {
      position: absolute;
      right: -120px;
      bottom: -160px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .hero-route {
      position: absolute;
      left: 90px;
      bottom: 130px;
      width: 650px;
      height: 280px;
      border: 3px dashed rgba(255, 255, 255, 0.3);
      border-radius: 44px;
    }

    .login-hero h1 {
      position: relative;
      max-width: 700px;
      margin: 80px 0 0;
      font-size: 48px;
      line-height: 1.08;
    }

    .login-hero p {
      position: relative;
      max-width: 560px;
      margin-top: 22px;
      color: #cbd8ea;
      font-size: 18px;
      line-height: 1.55;
    }

    .login-form-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
    }

    .login-form {
      width: 420px;
    }

    .login-form h2 {
      margin: 0;
      font-size: 32px;
    }

    .login-form p {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field-label {
      margin: 18px 0 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 850;
    }

    .login-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      color: var(--muted);
    }

    .login-button {
      width: 100%;
      height: 54px;
      margin-top: 26px;
      border: 0;
      border-radius: 14px;
      background: var(--blue);
      color: #ffffff;
      font-size: 15px;
      font-weight: 850;
    }

    .two-column {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      gap: 18px;
      height: 770px;
    }

    .detail-card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .big-plate {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px;
      border-radius: 18px;
      background: var(--nav);
      color: #ffffff;
    }

    .plate-number {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .plate-meta {
      margin-top: 8px;
      color: #b8c6da;
      font-size: 13px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .metric {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-soft);
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric-value {
      margin-top: 8px;
      font-size: 22px;
      font-weight: 900;
    }

    .section-title {
      margin: 22px 0 12px;
      font-size: 16px;
      font-weight: 900;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .timeline-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #ffffff;
      font-size: 13px;
    }

    .timeline-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
    }

    .mock-map-panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        #edf6fb;
      background-size: 48px 48px;
      overflow: hidden;
    }

    .route-dot {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 6px 16px rgba(16, 35, 63, 0.24);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table th {
      padding: 13px 14px;
      background: var(--surface-soft);
      color: var(--muted);
      text-align: left;
      font-size: 12px;
      font-weight: 850;
    }

    .table td {
      padding: 14px;
      border-top: 1px solid var(--line);
      color: var(--text);
    }

    .screen-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 16px;
    }

    .sensor-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .sensor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .sensor-name {
      font-size: 15px;
      font-weight: 900;
    }

    .gauge {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: #e6edf5;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .chart {
      display: flex;
      align-items: end;
      gap: 9px;
      height: 146px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .bar {
      flex: 1;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(180deg, #2f80ed, #90c2ff);
    }

    .report-layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 18px;
      height: 770px;
    }

    .form-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .select-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 14px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .integration-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 16px;
    }

    .integration-card {
      min-height: 190px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    .integration-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 900;
      margin-bottom: 16px;
    }

    .mobile-shell {
      height: 100%;
      background: #ffffff;
    }

    .mobile-top {
      padding: 28px 22px 16px;
      background: var(--nav);
      color: #ffffff;
    }

    .mobile-top h2 {
      margin: 18px 0 4px;
      font-size: 24px;
    }

    .mobile-top p {
      margin: 0;
      color: #b8c6da;
      font-size: 13px;
    }

    .mobile-body {
      padding: 18px;
    }

    .mobile-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 8px 26px rgba(16, 35, 63, 0.08);
      margin-bottom: 14px;
    }

    .status-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .mobile-status {
      padding: 12px 8px;
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 850;
      text-align: center;
    }

    .mobile-status.active {
      background: var(--blue);
      color: #ffffff;
    }

    .phone-map {
      position: relative;
      height: 245px;
      border-radius: 20px;
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        #edf6fb;
      background-size: 36px 36px;
      overflow: hidden;
    }
  

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px;
    }

    .page {
      display: block;
      padding: 0;
    }

    .single-frame {
      margin: 0;
    }

    .screen-label {
      display: none;
    }

  </style>
</head>
<body>
  <main class="page">
    <section class="figma-frame mobile single-frame">
        <div class="label screen-label" style="top: 16px; right: 18px;">Mobile 01</div>
        <div class="mobile-shell">
          <div class="mobile-top">
            <div class="brand" style="margin-bottom: 0;"><div class="brand-mark">TL</div><div><div class="brand-title">Водитель</div><div class="brand-subtitle">А777КМ 77</div></div></div>
            <h2>Текущий рейс</h2>
            <p>Склад Москва - РЦ Тверь</p>
          </div>
          <div class="mobile-body">
            <div class="mobile-card">
              <div class="panel-title">Статус автомобиля</div>
              <div class="status-buttons">
                <div class="mobile-status">Свободен</div>
                <div class="mobile-status">Под загрузкой</div>
                <div class="mobile-status active">В пути</div>
                <div class="mobile-status">На разгрузке</div>
                <div class="mobile-status">На стоянке</div>
                <div class="mobile-status">Завершил рейс</div>
              </div>
            </div>
            <div class="mobile-card">
              <div class="panel-title">Маршрут</div>
              <p class="panel-subtitle">Назначенный маршрут и прогресс выполнения</p>
              <div class="phone-map">
                <div class="route" style="left: 38px; top: 92px; width: 250px; transform: rotate(18deg);"></div>
                <div class="route-dot" style="left: 42px; top: 86px;"></div>
                <div class="vehicle-marker blue" style="left: 164px; top: 120px;">77</div>
                <div class="route-dot" style="left: 292px; top: 166px; background: var(--green);"></div>
              </div>
            </div>
            <button class="login-button" style="margin-top: 0;">Подтвердить статус</button>
          </div>
        </div>
      </section>
  </main>
</body>
</html>
